<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        .header { background-color: #198754; color: white; padding: 10px; text-align: center; border-radius: 10px 10px 0 0; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .footer { font-size: 12px; text-align: center; margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Thanks for contacting Maharaj AI!</h2>
        </div>
        <div class="content">
            <p>Hi <strong>{{ name }}</strong>,</p>
            <p>We received your message regarding <strong>{{ subject }}</strong>.</p>
            <p>Our team will get back to you shortly at {{ email }}.</p>
            <hr>
            <p><strong>Your Message:</strong></p>
            <blockquote style="background: #fff; padding: 10px; border-left: 4px solid #198754;">
                {{ message }}
            </blockquote>
        </div>
        <div class="footer">
            <p>Sent on {{ now|date:"F j, Y, g:i a" }}</p>
        </div>
    </div>
</body>
</html>
